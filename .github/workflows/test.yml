name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    # Il codice di raccolta usa API di Windows (collector/win.py): va provato su Windows, non solo su Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
