softwareType: standalone/desktop

description:
  it:
    localisedName: Smart Working Istituzionale
    shortDescription: >-
      Resoconto giornaliero del lavoro agile per gli enti pubblici: raccolta minima sul PC, revisione del
      dipendente, PDF sigillato verificabile.
    longDescription: >-
      Il dipendente avvia la giornata, rivede dati automatici in sola lettura, aggiunge attività dichiarate e
      osservazioni, prepara il testo standard o richiede l'AI locale, verifica la sintesi e conferma un PDF.
      La V1 raccoglie soltanto eventi di sessione, attività informatica sì/no e applicazioni dell'elenco CED.
      Le fasce sono configurabili, con default 15 minuti. Rete e Halley sono disabilitati. Non vengono raccolti
      tasti, movimenti, schermate, titoli, file, contenuti o conteggi della posta, cronologia o URL.
      Il JSON /5 può includere lo snapshot tecnico autorizzato, escluso dall’AI e non deduce durata o qualità del lavoro.
      La provenienza resta distinta anche nelle frasi della sintesi. L'AI è opzionale, su 127.0.0.1 senza proxy
      o redirect esterni; in caso di indisponibilità o controllo fallito si usa il fallback. Il PDF contiene tutte
      le fasce, JSON allegato e sigilli Ed25519. La consegna è manuale. Retention raw disabilitata finché l'Ente
      non valida periodo e decorrenza; lo storico non marcato non viene eliminato automaticamente.
      Build di sviluppo non firmata, senza dichiarazioni di conformità. Prima dell'esercizio restano da validare
      informativa, DPO/DPIA, adempimenti applicabili, retention, ruoli/accessi, firma del codice e pilota.
      Nome e stemma dell’Ente adottante non sono coperti dalla EUPL; l’edizione pubblica usa un simbolo generico.
    features:
      - Raccolta tecnica minima locale, solo a giornata avviata
      - Provenienza distinta tra rilevato, dichiarato, osservazioni e sintesi
      - Testo standard oppure AI locale su richiesta, con fallback
      - PDF paginato con JSON /5 allegato, sigilli e Verificatore
      - Token centrali, font locali e identità configurabile tramite overlay
      - Tastiera e pannelli scorrevoli, senza cambio framework
      - Setup per utente e pacchetto senza modelli AI obbligatori
    documentation: "https://github.com/realfulvio/smart-working-istituzionale/blob/main/README.md"

